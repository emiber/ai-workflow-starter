name: Workflow integrity

# Checks the AI workflow files themselves (commands, skills, guides, entry files),
# not the project's stack. Kept as-is by /init-project; see workflow/scaffolding.md.
on:
  pull_request:
    branches:
      - main
      - "epic/**"

permissions:
  contents: read

jobs:
  workflow-integrity:
    # Required status check on main wherever main's protection or ruleset lists it: changing this name means updating that protection/ruleset in the same change.
    name: Workflow integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test the check itself
        run: bash .github/scripts/check-workflow.test.sh
      - name: Check commands, skills, and guide references
        run: bash .github/scripts/check-workflow.sh
      # The Claude Code plugin (.claude-plugin/), when the repo ships one. Pinned,
      # never latest; needs no API key. Warnings don't fail the job: the template's
      # root CLAUDE.md always triggers one, and errors still do.
      - name: Install Claude Code
        if: hashFiles('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json') != ''
        # Its postinstall script fetches the native binary, so don't pass --ignore-scripts.
        run: npm install --global @anthropic-ai/claude-code@2.1.319
      - name: Validate the Claude Code plugin and marketplace
        if: hashFiles('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json') != ''
        env:
          DISABLE_AUTOUPDATER: "1"
        run: claude plugin validate .
